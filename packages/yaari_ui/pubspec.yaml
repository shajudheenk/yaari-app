name: yaari_ui
description: "Shared design system, auth flow and widgets for the Yaari apps."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  cached_network_image: ^3.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Both families ship with the package so the apps render identically
  # whatever is installed on the device. These are static instances cut from
  # the variable fonts, so each weight is the designer's shape rather than a
  # synthetic bold. Fraunces is pinned to its display optical size with the
  # WONK swashes off, which are distracting at interface scale.
  fonts:
    # Phosphor Light, bundled as a font rather than through phosphor_flutter:
    # that package subclasses IconData, which Flutter has since made final,
    # so it no longer compiles. Same MIT-licensed icons; licence sits beside
    # the file.
    - family: PhosphorLight
      fonts:
        - asset: fonts/Phosphor-Light.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/Phosphor-Fill.ttf
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: fonts/Fraunces-Bold.ttf
          weight: 700
